# Local live stack: everything runs inside kind. Dev-only credentials.
---
apiVersion: v1
kind: Namespace
metadata:
  name: dark-factory
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-auth
  namespace: dark-factory
type: Opaque
stringData:
  DATABASE_URL: postgres://darkfactory:darkfactory-dev@postgres.dark-factory.svc:5432/darkfactory?sslmode=disable
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: dark-factory
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: darkfactory}
            - {name: POSTGRES_PASSWORD, value: darkfactory-dev}
            - {name: POSTGRES_DB, value: darkfactory}
          ports: [{containerPort: 5432}]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dark-factory
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: dark-factory
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: dark-factory
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: dark-factory
spec:
  replicas: 1
  selector: {matchLabels: {app: localstack}}
  template:
    metadata: {labels: {app: localstack}}
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3.2
          env:
            - {name: SERVICES, value: "dynamodb,s3,kms"}
          ports: [{containerPort: 4566}]
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: dark-factory
spec:
  selector: {app: localstack}
  ports: [{port: 4566}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mockoidc
  namespace: dark-factory
spec:
  replicas: 1
  selector: {matchLabels: {app: mockoidc}}
  template:
    metadata: {labels: {app: mockoidc}}
    spec:
      containers:
        - name: mockoidc
          image: dark-factory/mockoidc:dev
          args: ["--addr=:8082", "--public-url=http://localhost:30081"]
          ports: [{containerPort: 8082}]
---
apiVersion: v1
kind: Service
metadata:
  name: mockoidc
  namespace: dark-factory
spec:
  type: NodePort
  selector: {app: mockoidc}
  ports: [{port: 8082, nodePort: 30081}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: dark-factory
spec:
  replicas: 1
  selector: {matchLabels: {app: registry}}
  template:
    metadata: {labels: {app: registry}}
    spec:
      containers:
        - name: registry
          image: dark-factory/registry:dev
          envFrom: [{secretRef: {name: postgres-auth}}]
          env: [{name: OIDC_ISSUER, value: "http://mockoidc.dark-factory.svc:8082"}]
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: dark-factory
spec:
  type: NodePort
  selector: {app: registry}
  ports: [{port: 8080, nodePort: 30080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: dark-factory
spec:
  replicas: 1
  selector: {matchLabels: {app: orchestrator}}
  template:
    metadata: {labels: {app: orchestrator}}
    spec:
      containers:
        - name: orchestrator
          image: dark-factory/orchestrator:dev
          ports: [{containerPort: 8081}]
---
# Operator watches AgentSession CRs across all namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: operator
  namespace: dark-factory
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-session-operator
rules:
  - apiGroups: [agents.platform]
    resources: [agentsessions, agentsessions/status]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [namespaces, resourcequotas]
    verbs: [get, list, watch, create]
  - apiGroups: [scheduling.k8s.io]
    resources: [priorityclasses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-session-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-session-operator
subjects:
  - kind: ServiceAccount
    name: operator
    namespace: dark-factory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator
  namespace: dark-factory
spec:
  replicas: 1
  selector: {matchLabels: {app: operator}}
  template:
    metadata: {labels: {app: operator}}
    spec:
      serviceAccountName: operator
      containers:
        - name: operator
          image: dark-factory/operator:dev
          args: ["--sandbox-image=nginx:alpine"]
          ports: [{containerPort: 8083}]
